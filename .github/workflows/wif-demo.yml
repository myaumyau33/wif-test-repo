name: WIF Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub identity
        run: |
          echo "=== GitHub Actions ==="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Ref        : $GITHUB_REF"
          echo "Workflow   : $GITHUB_WORKFLOW"
          echo "Run ID     : $GITHUB_RUN_ID"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: iam-test-512213
          workload_identity_provider: projects/867496761966/locations/global/workloadIdentityPools/github-wif-demo/providers/github-oidc

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show federation configuration
        run: |
          echo "=== Workload Identity Federation ==="
          echo "Authentication : Direct WIF"
          echo "Pool           : github-wif-test"
          echo "Provider       : github-oidc"
          echo "Project        : $GOOGLE_CLOUD_PROJECT"

      - name: Access Google Cloud API
        run: |
          echo "=== Google Cloud Project ==="
          gcloud projects describe iam-test-512213 \
            --format="yaml(projectId,projectNumber,name,lifecycleState,createTime)"

      - name: Verify Google Cloud access
        run: |
          echo "=== Verification ==="
          PROJECT_NUMBER=$(gcloud projects describe iam-test-512213 \
            --format="value(projectNumber)")

          echo "Authenticated API request succeeded"
          echo "Target Project Number: $PROJECT_NUMBER"
