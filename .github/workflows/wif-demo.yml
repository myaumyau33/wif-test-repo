name: WIF Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: iam-test-512213
          workload_identity_provider: projects/867496761966/locations/global/workloadIdentityPools/github-wif-test/providers/github-oidc

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Test access
        run: |
          gcloud projects describe iam-test-512213 \
            --format="value(projectId)"
